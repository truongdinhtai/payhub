spring:
  application:
    name: payhub
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:changeit-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:changeit-client-secret}
            # No 'openid' scope on purpose: with openid, Spring uses the OIDC
            # pipeline (OidcUserService) and bypasses CustomOAuth2UserService, so
            # the user is never provisioned and the 'uid' attribute is missing
            # (NPE in OAuth2SuccessHandler). Plain OAuth2 (email, profile) routes
            # through our user service; Google's userinfo still returns sub/email/name/picture.
            scope:
              - email
              - profile
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payhub}
    username: ${DB_USERNAME:payhub}
    password: ${DB_PASSWORD:payhub}
  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates it matches the entities.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Application-specific settings
payhub:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  oauth2:
    # Where the browser is redirected (with the JWT in the URL fragment) after a
    # successful Google login.
    success-redirect: ${OAUTH2_SUCCESS_REDIRECT:http://localhost:4200/oauth2/callback}
  security:
    jwt:
      # Access-token lifetime (ISO-8601 duration).
      ttl: ${JWT_TTL:PT1H}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:4200/billing/success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:4200/billing/cancel}
