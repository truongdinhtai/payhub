# Render Blueprint for PayHub (free tier).
# In Render: New > Blueprint > pick this repo. It creates the database, the
# Spring backend (Docker) and the Angular frontend (static site). Fill in the
# values marked "sync: false" in the dashboard after the services are created.
#
# URLs are name-based: https://<service-name>.onrender.com. If a subdomain is
# taken and Render assigns a different one, update apiBaseUrl (frontend build),
# CORS_ALLOWED_ORIGINS and OAUTH2_SUCCESS_REDIRECT accordingly.

databases:
  - name: payhub-db
    plan: free
    databaseName: payhub
    user: payhub

services:
  # ---- Backend (Spring Boot, Docker) ----
  - type: web
    name: payhub-api
    runtime: docker
    plan: free
    rootDir: Backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # jdbc URL — set manually from the database's Internal connection info,
      # e.g. jdbc:postgresql://<host>:5432/payhub
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        fromDatabase:
          name: payhub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: payhub-db
          property: password
      # Frontend origin (set to the payhub-web URL once known)
      - key: CORS_ALLOWED_ORIGINS
        value: https://payhub-web.onrender.com
      - key: OAUTH2_SUCCESS_REDIRECT
        value: https://payhub-web.onrender.com/oauth2/callback
      # Secrets — fill in the dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ---- Frontend (Angular, static site) ----
  - type: web
    name: payhub-web
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/payhub-web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
